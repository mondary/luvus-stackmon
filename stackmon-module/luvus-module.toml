id = "pk.stackmon"
name = "Stack Monitor"
version = "0.1.0"
min_luvus_version = "0.13.4"
description = "RAM/CPU du stack terminal + agents (ghostty, omp, opencode, luvus, herdr) : widget barre, dock latéral et TUI."

[[bars]]
id = "stackmon"
title = "Stack Monitor"
region = "bottom-right"
priority = 50

[[docks]]
id = "pk:stackmon"
title = "STACK"
placement = "sidebar.left"

[[panes]]
id = "tui"
title = "Stack Monitor"
placement = "overlay"
command = ["sh", "tui"]

[[startup]]
command = ["sh", "loop.sh"]

[[actions]]
id = "refresh"
title = "Rafraîchir Stack Monitor"
command = ["sh", "push.sh"]

[[actions]]
id = "open-tui"
title = "Ouvrir Stack Monitor (TUI)"
contexts = ["pane"]
command = ["sh", "open-tui.sh"]

[[settings]]
key = "display"
title = "Affichage"
type = "enum"
options = ["bottom-right", "top-right", "dock"]
default = "bottom-right"
